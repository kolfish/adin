plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"adin" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	clientCompileOnly "io.github.llamalad7:mixinextras-fabric:0.5.5"

	compileOnly "org.projectlombok:lombok:${project.lombok_version}"
	annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
	clientCompileOnly "org.projectlombok:lombok:${project.lombok_version}"
	clientAnnotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

task resourcesJar(type: Jar) {
	archiveClassifier = 'resources'
	from(sourceSets.main.resources.srcDirs) {
		exclude '*.class'
	}
	from(sourceSets.client.resources.srcDirs) {
		exclude '*.class'
	}
}

task dllPrep(dependsOn: ['remapJar', 'resourcesJar']) {
	doLast {
		def buildDir = layout.buildDirectory.dir('libs').get().asFile
		println "DLL prep complete:"
		println "  Mod JAR: ${buildDir}/${project.name}-${version}.jar"
		println "  Resources JAR: ${buildDir}/${project.name}-${version}-resources.jar"
		println "Next steps:"
		println "  1. Run GenerateHeaders on the mod JAR"
		println "  2. Place resources JAR as 'adin-resources.jar' in .minecraft directory"
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
